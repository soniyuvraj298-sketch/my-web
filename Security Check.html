<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Security Check</title>
<style>
:root{--bg:#f1f3f4;--card:#fff;--text:#202124;--muted:#5f6368;--line:#dadce0;--accent:#1a73e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--card:#1e1e1e;--text:#e8eaed;--muted:#9aa0a6;--line:#3c4043;--accent:#8ab4f8}}
:root[data-theme="dark"]{--bg:#121212;--card:#1e1e1e;--text:#e8eaed;--muted:#9aa0a6;--line:#3c4043;--accent:#8ab4f8}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;width:100%;max-width:380px;text-align:center}
h1{font-size:1.2rem;margin:0 0 6px}
p{color:var(--muted);font-size:.9rem;margin:0 0 18px}
.robot{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:6px;padding:14px;cursor:pointer;text-align:left}
.box{width:26px;height:26px;border:2px solid var(--muted);border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:14px 0}
.tile{aspect-ratio:1;border-radius:6px;border:2px solid transparent;display:flex;align-items:center;justify-content:center;font-size:2.2rem;cursor:pointer;background:var(--bg)}
.tile.sel{border-color:var(--accent);transform:scale(.92)}
button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:10px 22px;font-size:1rem;cursor:pointer}
[hidden]{display:none!important}
#boom{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:min(40vw,50vh);z-index:9;background:#000;animation:flash .12s infinite alternate}
@keyframes flash{from{background:#000}to{background:#f00}}
</style>
</head>
<body>
<div class="card">
  <div id="s1">
    <h1>Checking your browser</h1>
    <p>Please confirm you are human to continue.</p>
    <div class="robot" id="robot"><div class="box" id="cb"></div><span>I'm not a robot</span></div>
  </div>
  <div id="s2" hidden>
    <h1>Select all traffic lights</h1>
    <p>Click every square that contains a traffic light.</p>
    <div class="grid" id="grid"></div>
    <button id="verify">Verify</button>
  </div>
</div>
<div id="boom">😱</div>
<script>
const $=id=>document.getElementById(id);
const icons=["🚦","🌳","🚗","🚦","🏠","🚲","🚦","🌳","🚌"];
icons.forEach(i=>{const d=document.createElement("div");d.className="tile";d.textContent=i;d.onclick=()=>d.classList.toggle("sel");$("grid").appendChild(d)});

$("robot").onclick=()=>{
  $("cb").textContent="⏳";
  setTimeout(()=>{$("s1").hidden=true;$("s2").hidden=false},900);
};

function scream(){audio.currentTime=0;audio.play().catch(()=>{});return dur}

$("verify").onclick=()=>{
  const dur=scream();
  $("boom").style.display="flex";
  if(navigator.vibrate)navigator.vibrate([300,100,300,100,300]);
  setTimeout(()=>{$("boom").style.display="none";$("s2").hidden=true;$("s1").hidden=false;$("cb").textContent=""},dur*1000+200);
};
</script>
